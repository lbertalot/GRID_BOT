services:
  # Base de datos principal
  db:
    image: postgres:16-alpine
    container_name: gridbot_db_ws
    restart: always
    environment:
      POSTGRES_USER: griduser
      POSTGRES_PASSWORD: gridpass
      POSTGRES_DB: gridbot
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata_ws:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"  # Puerto diferente para evitar conflictos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U griduser -d gridbot"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis para cache y Celery
  redis:
    image: redis:7-alpine
    container_name: gridbot_redis_ws
    restart: always
    ports:
      - "6380:6379"  # Puerto diferente para evitar conflictos
    volumes:
      - redis_data_ws:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API principal con WebSocket avanzado
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.websocket
    container_name: gridbot_api_ws
    restart: always
    ports:
      - "8001:8000"  # Puerto diferente para evitar conflictos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=gridbot-secret-key-2025-super-secure
      - DEBUG=true
      - ENVIRONMENT=development
      - DOCKER_ENV=true
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WEBSOCKET_ADVANCED=true
    volumes:
      - ./app:/app/app
      - ./grid_config_optimized.json:/app/grid_config_optimized.json
      - ./logs:/app/logs
    command: uvicorn app.main_simple:app --host 0.0.0.0 --port 8000 --reload --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery worker para tareas asíncronas
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.websocket
    container_name: gridbot_celery_worker_ws
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - WEBSOCKET_ADVANCED=true
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flower para monitoreo de Celery
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.websocket
    container_name: gridbot_flower_ws
    restart: always
    ports:
      - "5556:5555"  # Puerto diferente para evitar conflictos
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.core.celery_app flower --port=5555
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: gridbot_prometheus_ws
    restart: always
    ports:
      - "9091:9090"  # Puerto diferente para evitar conflictos
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/rules:/etc/prometheus/rules
      - prometheus_data_ws:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana para visualización
  grafana:
    image: grafana/grafana:latest
    container_name: gridbot_grafana_ws
    restart: always
    ports:
      - "3001:3000"  # Puerto diferente para evitar conflictos
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data_ws:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata_ws:
  redis_data_ws:
  prometheus_data_ws:
  grafana_data_ws: 