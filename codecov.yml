# codecov.yml — Configuración de Codecov para GridBot v2.5
#
# S-COV-85 COV-4.4 (2026-08-10):
#   - Project target: 85% (meta sprint) con threshold que absorbe el TOTAL
#     actual ~78% (85 − 7 = 78). Reducir threshold a 1–2% al cruzar 85%.
#   - informational: false → Codecov status deja de ser solo cosmético.
#   - Gate pytest CI: COVERAGE_FAIL_UNDER=80 (post-COV-5.9); subir 80→85 aparte.
#   - Patch: umbral sensible para código nuevo (no exige 85% en cada diff).
#
# Histórico: baseline CI ~25% (2026-04-26); informational=true durante hygiene.

coverage:
  precision: 2
  round: down
  range: "70...90"

  status:
    project:
      default:
        # COV-4.4: bloquea si cae por debajo de target−threshold
        informational: false
        target: 85%
        # Margen hasta TOTAL medido ~78% (Codecov/project post-#108/#109).
        # Bajar a "2%" cuando main sostenga ≥85% estable 2–3 días.
        threshold: 7%

    patch:
      default:
        informational: false
        # Código nuevo: cobertura útil sin exigir meta global en el diff
        target: 50%
        threshold: 5%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Ignorar archivos que no necesitan cobertura
ignore:
  - "scripts/archive/**"
  - "scripts/ops_watch/**"
  - "tests/**"
  - "alembic/**"
  - "docker/**"
  - "docs/**"
  - "Docs/**"
  - "monitoring_data/**"
  - "*.md"
  - "*.yml"
  - "*.yaml"
  - "*.json"
  - "*.sh"
