# Hooks locales — Calidad y seguridad antes del commit
#
# Instalación (una sola vez por desarrollador):
#   pip install pre-commit
#   pre-commit install
#
# Ejecución manual sobre todo el repo:
#   pre-commit run --all-files
#
# Ver docs/CICD_RUNBOOK.md para el flujo completo.

repos:
  # ── Higiene básica ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # excluir templates/jinja con sintaxis no estándar
        exclude: ^docker/grafana/dashboards/.*$
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  # ── ruff: linting + formatting (rápido) ─────────────────────────────────
  # Política escalonada del sprint de calidad:
  # - Reglas legacy ignoradas (E402, F841, F811, E501, E722, E712, F401):
  #   son drift pre-existente del código de aplicación (~99 errores en `app/`).
  #   Se limpiarán en sprint 2026-06 dedicado a code-hygiene.
  # - El resto sí bloquea localmente y en CI.
  # - scripts/archive/ y tests con drift documentado se excluyen completamente
  #   (ver TESTING_RULES.md §7 "Drift de tests pre-existentes").
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --extend-ignore=E402,F841,F811,E501,E722,E712,E711,E741,F401
        files: ^(app|tests|scripts)/
        exclude: |
          (?x)^(
            scripts/archive/.*|
            scripts/(release|setup_alerts|backup_configuration|export_openapi)\.py|
            scripts/balance_comparison\.py|
            scripts/optimize_config_with_current_data\.py|
            scripts/test_integrity_components\.py|
            scripts/test_integrity_system\.py|
            scripts/test_rebalancer_v2_simple\.py|
            scripts/validate_production\.py|
            tests/conftest\.py|
            tests/test_qaa_.*\.py|
            tests/test_(async_performance|auto_rebalancer_v2|binance_diagnostic|order_simulation|public_trading|optimized_grid_manager_save_trade)\.py
          )$
      - id: ruff-format
        files: ^(app|tests|scripts)/
        exclude: |
          (?x)^(
            scripts/archive/.*|
            tests/conftest\.py|
            tests/test_qaa_.*\.py
          )$

  # ── Bandit: seguridad estática (mismo umbral bloqueante que CI) ─────────
  # CI bloquea sólo en HIGH (ver .github/workflows/ci.yml). Los 12 MEDIUM
  # actuales (B108, B310, B104, B301) están documentados como deuda en
  # TESTING_RULES.md §7.5 con plan de mitigación para sprint 2026-06.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args:
          - "-r"
          - "app"
          - "--skip"
          - "B101,B601"
          - "--severity-level"
          - "high"
          - "--confidence-level"
          - "medium"
        # bandit ya recorre el directorio; pre-commit no debe pasarle archivos
        pass_filenames: false

  # ── detect-secrets: bloquear commits con keys/tokens reales ─────────────
  # Excluimos archivos con credenciales DE EJEMPLO (env.example, docker-compose,
  # docs de deployment con placeholders). El baseline `.secrets.baseline` registra
  # los hits residuales de archivos reales de la app. Cualquier secret nuevo en
  # archivos no excluidos bloquea el commit.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            tests/.*|
            docker/.*|
            scripts/archive/.*|
            env\.example|
            Docs/03-setup-and-installation\.md|
            Docs/MIGRATION_HEROKU_FREE_TIER\.md|
            Docs/guides/DEPLOYMENT_GUIDE\.md|
            Docs/guides/MONITORING_GUIDE\.md|
            activate_production\.sh
          )$
