services:
  # Base de datos principal con configuración mejorada
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: gridbot_db
    restart: always
    environment:
      POSTGRES_USER: griduser
      POSTGRES_PASSWORD: gridpass
      POSTGRES_DB: gridbot
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U griduser -d gridbot"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Redis para cache y Celery
  redis:
    image: redis:7-alpine
    container_name: gridbot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 768M

  # API principal con todas las mejoras y configuración unificada
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # SECRET_KEY debe existir en .env (compose no inventa valores). Dev local:
      #   SECRET_KEY=... (ver env.example). Producción: openssl rand -hex 32
      - SECRET_KEY=${SECRET_KEY}
      # Configuración de zona horaria para sincronización con Binance
      - TZ=UTC
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - NOISY_MODULE_LOG_LEVEL=${NOISY_MODULE_LOG_LEVEL:-ERROR}
      - ACCESS_LOG=${ACCESS_LOG:-false}
      - DOCKER_ENV=true
      # "api" es el host con el que Prometheus scrapea /metrics dentro de la red
      # compose; sin él el TrustedHostMiddleware devuelve 400 y no hay métricas.
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-false}
      # Sin PAPER_TRADING definido el stack arranca en simulación: operar real
      # exige declararlo explícitamente (PAPER_TRADING=false) + gate humano.
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - FORCE_REAL_MODE=${FORCE_REAL_MODE:-}
      # Fail-closed: sin env explícito → trading off + stop off (S-GATE / B26).
      - TRADING_ENABLED=${TRADING_ENABLED:-false}
      - EMERGENCY_STOP=${EMERGENCY_STOP:-false}
      - GRAFANA_URL=http://grafana:3000/api/health
      - PROMETHEUS_URL=http://prometheus:9090/-/healthy
      - PROM_URL=http://prometheus:9090/api/v1/targets
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WEBSOCKET_ADVANCED=true
      # Variables de optimización de estrategia
      - CALIBRATION_MODE=true
      - MIN_USDT_BALANCE=15.0
      - TARGET_USDT_BALANCE=30.0
      - ENABLE_AUTO_REBALANCE=true
      - REBALANCE_ASSET_PRIORITY=SPK,HOME,SIGN,BNB,BTC
      # Configuración de Numba para evitar problemas de cache en Docker
      - NUMBA_CACHE_DIR=/dev/null
      - NUMBA_DISABLE_JIT=0
      - NUMBA_DISABLE_CUDA=1
      - NUMBA_DISABLE_NVVM=1
      - NUMBA_DISABLE_CACHE=1
      - MPLCONFIGDIR=/tmp/matplotlib
      - MONITORING_DIR=/app/monitoring_data
      - REPORTS_DIR=/app/reports
      # B19 / ADR-008: ledger de ops en volume nombrado (kill floor).
      - OPS_LEDGER_PATH=${OPS_LEDGER_PATH:-/var/lib/gridbot/ops/ops_ledger.json}
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./grid_config_optimized.json:/app/grid_config_optimized.json
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./data:/app/data
      - ops_ledger_data:/var/lib/gridbot/ops
      - ./monitoring_data:/app/monitoring_data
      - ./reports:/app/reports
      - ./.venv:/app/.venv
      - numba_cache:/tmp/numba_cache
    # Modo por defecto: producción sin reload. Activar reload solo en perfil dev.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 3 --no-access-log
    profiles:
      - production
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health/liveness"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Celery worker para tareas asíncronas
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_celery_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - WEBSOCKET_ADVANCED=true
      # Sin PAPER_TRADING definido el stack arranca en simulación: operar real
      # exige declararlo explícitamente (PAPER_TRADING=false) + gate humano.
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - FORCE_REAL_MODE=${FORCE_REAL_MODE:-}
      # Fail-closed: sin env explícito → trading off + stop off (S-GATE / B26).
      - TRADING_ENABLED=${TRADING_ENABLED:-false}
      - EMERGENCY_STOP=${EMERGENCY_STOP:-false}
      - CELERYD_HIJACK_ROOT_LOGGER=false
      - CELERY_WORKER_REDIRECT_STDOUTS_LEVEL=${CELERY_LOG_LEVEL:-WARNING}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-false}
      - MONITORING_DIR=/app/monitoring_data
      # Variables de optimización de estrategia
      - CALIBRATION_MODE=true
      - MIN_USDT_BALANCE=15.0
      - TARGET_USDT_BALANCE=30.0
      - ENABLE_AUTO_REBALANCE=true
      - REBALANCE_ASSET_PRIORITY=SPK,HOME,SIGN,BNB,BTC
      - REPORTS_DIR=/app/reports
      # Evita mkdir bajo /home/gridbot (usuario sin home escribible en imagen)
      - MPLCONFIGDIR=/tmp/matplotlib
      - OPS_LEDGER_PATH=${OPS_LEDGER_PATH:-/var/lib/gridbot/ops/ops_ledger.json}
    volumes:
      - ./app:/app/app
      - ./grid_config_optimized.json:/app/grid_config_optimized.json
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./data:/app/data
      - ops_ledger_data:/var/lib/gridbot/ops
      - ./monitoring_data:/app/monitoring_data
      - ./reports:/app/reports
      - ./.venv:/app/.venv
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    # Celery env vars añadidas en bloque superior de environment (evitar claves duplicadas)
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Celery beat para tareas programadas
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_celery_beat
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-false}
      # Sin PAPER_TRADING definido el stack arranca en simulación: operar real
      # exige declararlo explícitamente (PAPER_TRADING=false) + gate humano.
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - FORCE_REAL_MODE=${FORCE_REAL_MODE:-}
      # Fail-closed: sin env explícito → trading off + stop off (S-GATE / B26).
      - TRADING_ENABLED=${TRADING_ENABLED:-false}
      - EMERGENCY_STOP=${EMERGENCY_STOP:-false}
      - MONITORING_DIR=/app/monitoring_data
      - REPORTS_DIR=/app/reports
      - MPLCONFIGDIR=/tmp/matplotlib
      - OPS_LEDGER_PATH=${OPS_LEDGER_PATH:-/var/lib/gridbot/ops/ops_ledger.json}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./monitoring_data:/app/monitoring_data
      - ./reports:/app/reports
      - ops_ledger_data:/var/lib/gridbot/ops
      - ./.venv:/app/.venv
    command: celery -A app.core.celery_app beat --loglevel=warning --schedule /tmp/celerybeat-schedule --pidfile=/tmp/celerybeat.pid
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M

  # Flower para monitoreo de Celery
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_flower
    restart: always
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./.venv:/app/.venv
    command: celery -A app.core.celery_app flower --port=5555 --loglevel=warning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # Prometheus para métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: gridbot_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 512M

  # Grafana para visualización con PostgreSQL
  grafana:
    image: grafana/grafana:latest
    container_name: gridbot_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=gridbot123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=db:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana_pass
      - GF_DATABASE_SSL_MODE=disable
      # Configuración para resolver problemas de token rotation
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SESSION_COOKIE_SECURE=false
      - GF_SESSION_COOKIE_SAMESITE=lax
      - GF_SESSION_COOKIE_NAME=grafana_sess
      - GF_SESSION_GC_INTERVAL_TIME=86400
      - GF_SESSION_GC_LIFETIME=86400
      - GF_SESSION_LENGTH=86400
      - GF_LIVE_MAX_CONNECTIONS=0
      - GF_LIVE_ALLOWED_ORIGINS=
      # Configuración de logging para debug
      - GF_LOG_LEVEL=warn
      - GF_LOG_MODE=console
      # Configuración adicional para resolver problemas de autenticación
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_JWT_ENABLED=false
      - GF_AUTH_PROXY_ENABLED=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 768M

  # Alertmanager para alertas
  alertmanager:
    image: prom/alertmanager:latest
    container_name: gridbot_alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: gridbot_redis_exporter
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  # Postgres Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: gridbot_postgres_exporter
    restart: always
    environment:
      - DATA_SOURCE_NAME=postgresql://griduser:gridpass@db:5432/gridbot?sslmode=disable
    depends_on:
      - db
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M

  # cAdvisor — en Docker Desktop montar containerd.sock (ver docker-compose.local.yml).
  # Imagen antigua v0.47 sin containerd falla factory Docker con overlayfs moderno.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: gridbot_cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - ./docker/cadvisor/machine-id:/etc/machine-id:ro
      - ./docker/cadvisor/machine-id:/rootfs/etc/machine-id:ro
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --docker_only
      - --docker=unix:///var/run/docker.sock
      - --containerd=/run/containerd/containerd.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/healthz >/dev/null && wget -q -O - http://localhost:8080/api/v1.3/docker | grep -q '\"' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - gridbot_network
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M

  # Nginx como proxy reverso (opcional para producción)
  nginx:
    image: nginx:alpine
    container_name: gridbot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - gridbot_network
    profiles:
      - production

  # API (perfil desarrollo) con reload y exclusiones para evitar reinicios por tests
  api_dev:
    extends:
      service: api
    container_name: gridbot_api_dev
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude tests/* --workers 1
    profiles:
      - development

volumes:
  pgdata:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  numba_cache:
  # B19: JSON ops ledger (OPS_LEDGER_PATH). Sobrevive recreate sin `down -v`.
  ops_ledger_data:

networks:
  gridbot_network:
    driver: bridge
