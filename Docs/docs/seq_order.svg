<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420">
  <style>
    .lifeline{stroke:#2c3e50;stroke-width:1}
    .box{fill:#eef6ff;stroke:#2c3e50;stroke-width:1}
    .text{font:12px sans-serif;fill:#2c3e50}
    .arrow{stroke:#2c3e50;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Lifelines -->
  <text class="text" x="40" y="20">Client</text>
  <line class="lifeline" x1="60" y1="30" x2="60" y2="400"/>

  <text class="text" x="240" y="20">FastAPI</text>
  <line class="lifeline" x1="260" y1="30" x2="260" y2="400"/>

  <text class="text" x="460" y="20">Validator</text>
  <line class="lifeline" x1="480" y1="30" x2="480" y2="400"/>

  <text class="text" x="680" y="20">Binance</text>
  <line class="lifeline" x1="700" y1="30" x2="700" y2="400"/>

  <!-- Messages -->
  <line class="arrow" x1="60" y1="60" x2="260" y2="60"/>
  <text class="text" x="80" y="55">POST /api/trade</text>

  <line class="arrow" x1="260" y1="90" x2="480" y2="90"/>
  <text class="text" x="270" y="85">Validar filtros + saldo</text>

  <line class="arrow" x1="480" y1="120" x2="700" y2="120"/>
  <text class="text" x="490" y="115">exchange_info + balance</text>

  <line class="arrow" x1="700" y1="150" x2="480" y2="150"/>
  <text class="text" x="600" y="145">response</text>

  <line class="arrow" x1="260" y1="180" x2="700" y2="180"/>
  <text class="text" x="320" y="175">Enviar orden (asíncrono)</text>

  <line class="arrow" x1="700" y1="210" x2="260" y2="210"/>
  <text class="text" x="560" y="205">ack / estado</text>

  <line class="arrow" x1="260" y1="240" x2="60" y2="240"/>
  <text class="text" x="100" y="235">200 OK / detalle</text>
</svg>
