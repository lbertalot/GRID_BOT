<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360">
  <style>
    .box{fill:#f5fff8;stroke:#1e6f3d;stroke-width:1.2}
    .title{font:bold 13px sans-serif;fill:#1e6f3d}
    .text{font:12px sans-serif;fill:#1e6f3d}
    .rel{stroke:#1e6f3d;stroke-width:1}
  </style>

  <rect class="box" x="60" y="40" width="230" height="140" rx="6"/>
  <text class="title" x="80" y="65">trades</text>
  <text class="text" x="80" y="90">id (pk), symbol, side</text>
  <text class="text" x="80" y="110">qty, entry_price, exit_price</text>
  <text class="text" x="80" y="130">profit_loss, created_at</text>

  <rect class="box" x="360" y="40" width="230" height="120" rx="6"/>
  <text class="title" x="380" y="65">system_settings</text>
  <text class="text" x="380" y="90">key (pk), value</text>
  <text class="text" x="380" y="110">updated_at</text>

  <rect class="box" x="660" y="40" width="200" height="120" rx="6"/>
  <text class="title" x="680" y="65">alerts</text>
  <text class="text" x="680" y="90">id (pk), type, severity</text>
  <text class="text" x="680" y="110">payload, created_at</text>

  <line class="rel" x1="290" y1="110" x2="360" y2="100" />
  <line class="rel" x1="590" y1="100" x2="660" y2="100" />
</svg>
