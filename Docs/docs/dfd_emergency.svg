<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380">
  <style>
    .box{fill:#fff8f0;stroke:#8e4b10;stroke-width:1.2}
    .title{font:bold 13px sans-serif;fill:#8e4b10}
    .text{font:12px sans-serif;fill:#8e4b10}
    .arrow{stroke:#8e4b10;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8e4b10" />
    </marker>
  </defs>

  <rect class="box" x="40" y="40" width="250" height="90" rx="6"/>
  <text class="title" x="60" y="65">Detección de Discrepancia</text>
  <text class="text" x="60" y="90">balance_discrepancy_usd > umbral</text>

  <rect class="box" x="360" y="40" width="250" height="90" rx="6"/>
  <text class="title" x="380" y="65">Circuit Breakers</text>
  <text class="text" x="380" y="90">protect() / emergency_stop()</text>

  <rect class="box" x="680" y="40" width="250" height="90" rx="6"/>
  <text class="title" x="700" y="65">Acciones</text>
  <text class="text" x="700" y="90">congelar órdenes / cerrar posiciones</text>

  <rect class="box" x="200" y="180" width="560" height="140" rx="6"/>
  <text class="title" x="220" y="205">Alertas y Auditoría</text>
  <text class="text" x="220" y="230">• Prometheus Alertmanager</text>
  <text class="text" x="220" y="250">• Telegram (cooldown)</text>
  <text class="text" x="220" y="270">• JSON de auditoría</text>

  <line class="arrow" x1="290" y1="85" x2="360" y2="85"/>
  <line class="arrow" x1="610" y1="85" x2="680" y2="85"/>
  <line class="arrow" x1="485" y1="130" x2="485" y2="180"/>
</svg>
