<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420">
  <style>
    .box{fill:#f7faff;stroke:#2c3e50;stroke-width:1.2}
    .title{font: bold 14px sans-serif; fill:#2c3e50}
    .text{font: 12px sans-serif; fill:#2c3e50}
    .arrow{stroke:#2c3e50;stroke-width:1.2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Top row -->
  <rect class="box" x="40" y="30" width="240" height="120" rx="6"/>
  <text class="title" x="60" y="55">HybridMLEngine</text>
  <text class="text" x="60" y="80">• LSTM / Transformer (largo plazo)</text>
  <text class="text" x="60" y="100">• River (online, corto plazo)</text>
  <text class="text" x="60" y="120">• Predicción de régimen</text>

  <rect class="box" x="340" y="30" width="240" height="120" rx="6"/>
  <text class="title" x="360" y="55">StrategySelector</text>
  <text class="text" x="360" y="80">• Lógica de estrategias</text>
  <text class="text" x="360" y="100">• Parámetros dinámicos</text>
  <text class="text" x="360" y="120">• Regime analysis</text>

  <rect class="box" x="640" y="30" width="240" height="120" rx="6"/>
  <text class="title" x="660" y="55">RiskManager</text>
  <text class="text" x="660" y="80">• Kelly Fraccional</text>
  <text class="text" x="660" y="100">• Trailing Stops</text>
  <text class="text" x="660" y="120">• Circuit Breakers</text>

  <!-- Middle backtesting -->
  <rect class="box" x="240" y="190" width="240" height="110" rx="6"/>
  <text class="title" x="260" y="215">Backtesting</text>
  <text class="text" x="260" y="240">• vectorbt</text>
  <text class="text" x="260" y="260">• Walk-Forward</text>
  <text class="text" x="260" y="280">• Métricas de rendimiento</text>

  <!-- Binance client -->
  <rect class="box" x="520" y="190" width="240" height="110" rx="6"/>
  <text class="title" x="540" y="215">BinanceClient</text>
  <text class="text" x="540" y="240">• Validación filtros</text>
  <text class="text" x="540" y="260">• Rate limiting</text>
  <text class="text" x="540" y="280">• WebSocket</text>

  <!-- API layer -->
  <rect class="box" x="40" y="330" width="840" height="60" rx="6"/>
  <text class="title" x="60" y="355">API FastAPI / Celery / Observabilidad</text>
  <text class="text" x="60" y="375">Endpoints (trading/estrategias/métricas/simulaciones) · Prometheus/Grafana · IntegrityGuardMiddleware</text>

  <!-- Arrows -->
  <line class="arrow" x1="160" y1="150" x2="360" y2="190"/>
  <line class="arrow" x1="460" y1="150" x2="360" y2="190"/>
  <line class="arrow" x1="760" y1="150" x2="760" y2="190"/>
  <line class="arrow" x1="360" y1="300" x2="120" y2="330"/>
  <line class="arrow" x1="640" y1="300" x2="840" y2="330"/>
</svg>
