# ci-cd-pipeline-agent — Pipeline completo para GridBot
#
# Stages:
#   1. lint           — pyflakes, ruff (linting)
#   2. security-scan  — bandit (BLOQUEANTE), pip-audit (BLOQUEANTE)
#   3. test           — pytest con PostgreSQL real + cobertura escalonada
#   4. migrations     — verifica que las migraciones Alembic son válidas
#   5. docker         — build de imagen (push a GHCR en main)
#   6. deploy         — deploy a Heroku (solo en main)
#
# Estrategia de cobertura escalonada (TESTING_RULES.md §3 + docs/CICD_RUNBOOK.md):
#   - Baseline real medido: 29.05% (2026-04-26).
#   - Gate inicial: COVERAGE_FAIL_UNDER=29 (no rompe build el día 1).
#   - Plan: +5pp por sprint hasta 85% global. Mínimos por módulo crítico
#     YA están cumplidos (ver TESTING_RULES.md §3).

name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/grid-bot
  # Gate de cobertura escalonado. Subir +5 cada sprint (ver CICD_RUNBOOK.md).
  COVERAGE_FAIL_UNDER: "29"

# ─── JOB 1: Lint ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar herramientas de lint
        run: pip install pyflakes ruff

      - name: pyflakes (errores reales bloqueantes)
        run: |
          # pyflakes no distingue severidad: reporta imports no usados al mismo
          # nivel que un undefined name. Solo bloqueamos errores reales.
          python -m pyflakes app | tee pyflakes.log || true
          echo ""
          echo "── Errores bloqueantes (undefined / syntax) ──"
          if grep -E "undefined name|invalid syntax|may be undefined" pyflakes.log; then
            echo ""
            echo "❌ Errores reales de pyflakes. Corregir antes de mergear."
            exit 1
          fi
          echo "✅ Sin errores bloqueantes."

      - name: ruff check (best-effort; no bloqueante hasta que se adopte)
        run: ruff check app tests || true

# ─── JOB 2: Security scan (BLOQUEANTE) ───────────────────────────────────────
  security-scan:
    name: Security Scan (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar herramientas de seguridad
        run: pip install bandit pip-audit

      - name: Bandit (HIGH severity) — BLOQUEANTE
        run: |
          # B101 (assert_used): permitido en tests/.
          # B601 (paramiko_calls): no usamos paramiko.
          # Severidad ALTA bloquea el build (FASE 6.4 — sin HIGH/CRITICAL).
          bandit -r app \
            --skip B101,B601 \
            --severity-level high \
            --confidence-level medium \
            -f txt

      - name: Bandit (MEDIUM severity) — informativo (no bloqueante)
        run: |
          # 12 hallazgos MEDIUM conocidos (ver TESTING_RULES.md §7 deuda):
          #   - B108 hardcoded_tmp_directory (3x — paths /tmp legítimos)
          #   - B310 urllib_urlopen (3x — URLs validadas internamente)
          #   - B104 bind_all_interfaces (1x — uvicorn 0.0.0.0 esperado)
          #   - B301 pickle (2x — pickle de datos confiables)
          # Bloqueará en sprint 2026-06 cuando se documente cada caso con #nosec.
          bandit -r app \
            --skip B101,B601 \
            --severity-level medium \
            --confidence-level medium \
            -f txt || true

      - name: pip-audit (CVEs en dependencias) — BLOQUEANTE con allow-list
        run: |
          # Lista explícita de CVEs ignorados con justificación
          # (ver TESTING_RULES.md §7 — Deuda de seguridad planificada):
          #
          # - GHSA-jfh8-c2jp-5r3q: vuln transitiva en pip < 25 sin patch upstream;
          #   no afecta runtime (solo entorno de instalación).
          #
          # - PYSEC-2024-38 (fastapi 0.104.1): ReDoS en parser de Content-Type.
          #   Mitigación: detrás de Nginx con rate-limit + WAF; upgrade a 0.109+
          #   planificado para sprint 2026-05 (requiere validar compat con Pydantic v2).
          #
          # - CVE-2024-47874 (starlette 0.27.0): DoS vía multipart/form-data sin
          #   Content-Length. GridBot no expone endpoints multipart sin auth +
          #   request size cap. Upgrade a starlette 0.40.0+ con fastapi 0.109+.
          #
          # - CVE-2025-54121 (starlette 0.27.0): DoS por unbounded BodyParser en
          #   uploads. Mismo mitigante (auth + límites Nginx) y mismo plan upgrade.
          pip-audit -r requirements.txt \
            --ignore-vuln GHSA-jfh8-c2jp-5r3q \
            --ignore-vuln PYSEC-2024-38 \
            --ignore-vuln CVE-2024-47874 \
            --ignore-vuln CVE-2025-54121

# ─── JOB 3: Tests con PostgreSQL real ────────────────────────────────────────
  test:
    name: Tests (PostgreSQL) + Coverage Gate
    runs-on: ubuntu-latest
    needs: [lint, security-scan]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gridbot_test
          POSTGRES_USER: gridbot
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-mock

      - name: Tests + Cobertura (gate escalonado)
        env:
          DATABASE_URL: postgresql://gridbot:testpass@localhost:5432/gridbot_test
          REDIS_URL: redis://localhost:6379/0
          USE_REAL_BINANCE: "0"
          SKIP_API_HEALTHCHECK: "1"
          CI: "true"
          PAPER_TRADING: "true"
          BINANCE_TESTNET: "true"
          FORCE_REAL_MODE: "false"
          TRADING_ENABLED: "false"
          EMERGENCY_STOP: "true"
          EXPORT_OPENAPI: "0"
          INTEGRITY_GUARD_DISABLED: "1"
          BINANCE_API_KEY: "ci_dummy_key"
          BINANCE_SECRET_KEY: "ci_dummy_secret"
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: |
          pytest tests/ \
            -q \
            --maxfail=10 \
            --disable-warnings \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=${COVERAGE_FAIL_UNDER}

      - name: QAA suite — línea de defensa (bloqueante, 0 failures)
        env:
          DATABASE_URL: postgresql://gridbot:testpass@localhost:5432/gridbot_test
          REDIS_URL: redis://localhost:6379/0
          CI: "true"
          PAPER_TRADING: "true"
          INTEGRITY_GUARD_DISABLED: "1"
          BINANCE_API_KEY: "ci_dummy_key"
          BINANCE_SECRET_KEY: "ci_dummy_secret"
        run: pytest tests/test_qaa_*.py -q --no-cov

      - name: Subir cobertura a Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# ─── JOB 4: Verificar migraciones Alembic ────────────────────────────────────
  migrations:
    name: Alembic Migrations Check
    runs-on: ubuntu-latest
    needs: [lint, security-scan]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: gridbot_migrations
          POSTGRES_USER: gridbot
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar migraciones (upgrade head) — incluye nuevas migraciones
        env:
          DATABASE_URL: postgresql://gridbot:testpass@localhost:5432/gridbot_migrations
          BINANCE_API_KEY: "ci_dummy"
          BINANCE_SECRET_KEY: "ci_dummy"
        run: |
          # Cubre las migraciones nuevas:
          #   - 20260421_schema_hardening_ingestion.py
          #   - 20260421_trades_idempotency_columns.py
          #   - 20260424_merge_heads_trades_order_idx.py
          alembic upgrade head

      - name: Verificar que no hay migraciones pendientes
        env:
          DATABASE_URL: postgresql://gridbot:testpass@localhost:5432/gridbot_migrations
          BINANCE_API_KEY: "ci_dummy"
          BINANCE_SECRET_KEY: "ci_dummy"
        run: |
          PENDING=$(alembic current 2>&1)
          echo "Estado Alembic: $PENDING"
          alembic current | grep "(head)" || (echo "❌ Migraciones pendientes detectadas" && exit 1)

# ─── JOB 5: Docker build (y push en main) ────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, migrations]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─── JOB 6: Deploy a Heroku (solo en main) ───────────────────────────────────
  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy a Heroku via Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          if [ -z "$HEROKU_API_KEY" ] || [ -z "$HEROKU_APP_NAME" ]; then
            echo "⚠️  HEROKU_API_KEY o HEROKU_APP_NAME no configurados — deploy omitido"
            exit 0
          fi
          curl https://cli-assets.heroku.com/install.sh | sh
          echo "$HEROKU_API_KEY" | docker login --username=_ \
            --password-stdin registry.heroku.com
          docker pull ${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:latest \
            registry.heroku.com/$HEROKU_APP_NAME/web
          docker push registry.heroku.com/$HEROKU_APP_NAME/web
          heroku container:release web --app $HEROKU_APP_NAME
          echo "✅ Deploy completado a Heroku app: $HEROKU_APP_NAME"

      - name: Ejecutar migraciones en Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          if [ -z "$HEROKU_API_KEY" ] || [ -z "$HEROKU_APP_NAME" ]; then
            exit 0
          fi
          heroku run --app $HEROKU_APP_NAME "alembic upgrade head" || true
