name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pyflakes pytest-mock

      - name: Lint (basic)
        run: |
          python -m pyflakes app || true

      - name: Security audit (pip-audit)
        run: |
          pip-audit -r requirements.txt || true

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379
          # Evitar llamadas reales a Binance/externas en CI
          USE_REAL_BINANCE: "0"
          SKIP_API_HEALTHCHECK: "1"
          CI: "true"
          PAPER_TRADING: "true"
          BINANCE_TESTNET: "true"
          FORCE_REAL_MODE: "false"
          TRADING_ENABLED: "false"
          EMERGENCY_STOP: "true"
          EXPORT_OPENAPI: "0"
        run: |
          pytest -q --maxfail=1 --disable-warnings --cov=app --cov-report=xml:coverage.xml || true
          [ -f coverage.xml ] || touch coverage.xml
          echo "\n==== Coverage (term-missing, skip-covered) ===="
          pytest -q --maxfail=1 --disable-warnings --cov=app --cov-report=term-missing:skip-covered || true

      - name: Export OpenAPI schema
        env:
          PYTHONPATH: .
          USE_REAL_BINANCE: "0"
          BINANCE_TESTNET: "true"
          PAPER_TRADING: "true"
          EXPORT_OPENAPI: "1"
        run: |
          python scripts/export_openapi.py

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: Docs/openapi.json

      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
