version: '3.8'

services:
  # Base de datos principal con configuración mejorada
  db:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: gridbot_db
    restart: always
    environment:
      POSTGRES_USER: griduser
      POSTGRES_PASSWORD: gridpass
      POSTGRES_DB: gridbot
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U griduser -d gridbot"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # Redis para cache y Celery
  redis:
    image: redis:7-alpine
    container_name: gridbot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # API principal con todas las mejoras
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=gridbot-secret-key-2025-super-secure
      - DEBUG=true
      - ENVIRONMENT=development
      - DOCKER_ENV=true
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - WEBSOCKET_ADVANCED=false
      - PAPER_TRADING=true
      - BINANCE_TESTNET=true
    volumes:
      - ./app:/app/app
      - ./grid_config_optimized.json:/app/grid_config_optimized.json
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # Celery worker para tareas asíncronas
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_celery_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - WEBSOCKET_ADVANCED=false
      - PAPER_TRADING=true
      - BINANCE_TESTNET=true
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./data:/app/data
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD", "celery", "-A", "app.core.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # Celery beat para tareas programadas
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_celery_beat
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://griduser:gridpass@db:5432/gridbot
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    command: celery -A app.core.celery_app beat --loglevel=info
    networks:
      - gridbot_network

  # Flower para monitoreo de Celery
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridbot_flower
    restart: always
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.core.celery_app flower --port=5555
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # Prometheus para métricas con TLS
  prometheus:
    image: prom/prometheus:latest
    container_name: gridbot_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus-tls.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/rules:/etc/prometheus/rules
      - ./docker/ssl/certs:/etc/prometheus/ssl
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.config.file=/etc/prometheus/web.yml'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # Grafana para visualización con PostgreSQL
  grafana:
    image: grafana/grafana:latest
    container_name: gridbot_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=gridbot123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=db:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana_pass
      - GF_DATABASE_SSL_MODE=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gridbot_network

  # Alertmanager para alertas con TLS
  alertmanager:
    image: prom/alertmanager:latest
    container_name: gridbot_alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager-tls.yml:/etc/alertmanager/alertmanager.yml
      - ./docker/ssl/certs:/etc/alertmanager/ssl
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.config.file=/etc/alertmanager/web.yml'
    networks:
      - gridbot_network

  # Nginx como proxy reverso con SSL
  nginx:
    image: nginx:alpine
    container_name: gridbot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx-ssl.conf:/etc/nginx/nginx.conf
      - ./docker/ssl/certs:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - gridbot_network

volumes:
  pgdata:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  gridbot_network:
    driver: bridge 