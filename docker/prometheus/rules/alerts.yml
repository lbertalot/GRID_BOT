groups:
  - name: gridbot_alerts
    rules:
      # Regla GridBotAPIDown se gestiona en availability_rules.yml (5m warning / 15m critical)
      # Evitamos duplicados que generan ruido durante deploys/restarts.

      # Alerta cuando hay errores en las órdenes de trading
      - alert: TradingOrderErrors
        expr: rate(gridbot_trading_orders_failed_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Errores en órdenes de trading"
          description: "Tasa de errores en órdenes de trading es alta"

      # Alerta cuando el balance es bajo
      - alert: LowBalance
        expr: gridbot_balance_usdt < 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Balance USDT bajo"
          description: "El balance de USDT está por debajo de $50"

      # Alerta cuando hay pérdidas significativas
      - alert: SignificantLosses
        expr: gridbot_daily_pnl < -100
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Pérdidas significativas detectadas"
          description: "Pérdidas diarias superan $100"

      # Alerta cuando Redis no responde
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis está caído"
          description: "Redis ha estado caído por más de 1 minuto"

      # Alerta cuando PostgreSQL no responde
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL está caído"
          description: "PostgreSQL ha estado caído por más de 1 minuto"

      # Alerta cuando Celery/Flower no responde al scrape
      - alert: CeleryWorkerDown
        expr: up{job="gridbot-celery"} == 0
        for: 2m
        labels:
          severity: warning
          component: celery
        annotations:
          summary: "Flower/Celery scrape caído"
          description: "up{job=gridbot-celery} == 0 por más de 2 minutos"

      # 0 workers vivos (Flower ve el nodo offline)
      - alert: CeleryWorkersOnlineZero
        expr: (sum(flower_worker_online{job="gridbot-celery"} == 1) or vector(0)) == 0
        for: 2m
        labels:
          severity: critical
          component: celery
        annotations:
          summary: "Ningún Celery worker online"
          description: "flower_worker_online vivos = 0 por más de 2 minutos"

      # Alerta cuando la latencia de la API es alta
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latencia alta en la API"
          description: "El 95% de las requests tardan más de 1 segundo"

      # Fallos Celery >5% en 1h (métricas Flower estándar)
      - alert: CeleryTaskFailures
        expr: |
          (
            sum(increase(flower_events_total{job="gridbot-celery", type="task-failed"}[1h]))
            /
            clamp_min(
              sum(increase(flower_events_total{job="gridbot-celery", type=~"task-succeeded|task-failed"}[1h])),
              1
            )
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: celery
        annotations:
          summary: "Tasa de fallos Celery >5% (1h)"
          description: "failed/(succeeded+failed) > 5% en la última hora"
