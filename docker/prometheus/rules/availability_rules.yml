groups:
  - name: gridbot-availability
    rules:
      - alert: GridBotAPIDownWarning
        expr: |
          max_over_time(up{job="gridbot-api"}[5m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "API de GridBot no responde (warning)"
          description: "up=0 de forma continua (max_over_time=0 por 5m) y sostenido 15m."

      - alert: GridBotAPIDown
        expr: |
          (absent(up{job="gridbot-api"}) OR (up{job="gridbot-api"} == 0))
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "API de GridBot caída (critical)"
          description: "up{job='gridbot-api'} ausente o 0 por >15m."
