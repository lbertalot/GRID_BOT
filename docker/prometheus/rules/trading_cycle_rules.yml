groups:
  - name: gridbot-trading-cycle
    rules:
      - alert: GridBotNoExecutionWithDecisions
        expr: |
          (sum_over_time(cycle_decision_ready[15m]) > 0)
          and on() (sum_over_time(cycle_order_executed[15m]) == 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sin ejecuciones con decisiones listas (15m)"
          description: "Hay decisiones listas pero no se enviaron órdenes en los últimos 15 minutos."

      - alert: GridBotTickStalled
        expr: |
          absent(cycle_phase_timestamp{phase="evaluation"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tick 5m detenido"
          description: "No se observa actividad de fase 'evaluation' en 10 minutos."

      # Paper-aware (L0): ROI diario negativo en paper es ruido (fees/MtM), no edge.
      # Mute mientras effective_mode=paper — mismo patrón que pipeline_ingestion_rules.
      - alert: LowDailyROI
        expr: |
          roi_daily_percent{strategy="grid"} < 0
          and on() (
            (max(trading_effective_mode{mode="paper"}) or on() vector(0)) < 1
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "ROI diario negativo"
          description: >-
            El ROI diario es < 0% durante 30m (solo fuera de paper).
            En paper L0 esta alerta está muteada a propósito.

      - alert: HighSlippage
        expr: average_slippage > 0.0005
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slippage elevado"
          description: "El slippage promedio supera 0.05% durante 10m"

      - alert: BinanceAPIErrorsSpike
        expr: rate(binance_api_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Errores de API de Binance elevados"
          description: "Tasa > 1 error/min en 5m"
