global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      scheme: https
      tls_config:
        ca_file: /etc/prometheus/ssl/ca.pem
        cert_file: /etc/prometheus/ssl/client-cert.pem
        key_file: /etc/prometheus/ssl/client-key.pem
        insecure_skip_verify: false

scrape_configs:
  # Prometheus se scrapea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/ssl/ca.pem
      cert_file: /etc/prometheus/ssl/client-cert.pem
      key_file: /etc/prometheus/ssl/client-key.pem
      insecure_skip_verify: false

  # GridBot API
  - job_name: 'gridbot-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/ssl/ca.pem
      cert_file: /etc/prometheus/ssl/client-cert.pem
      key_file: /etc/prometheus/ssl/client-key.pem
      insecure_skip_verify: false

  # GridBot Celery
  - job_name: 'gridbot-celery'
    static_configs:
      - targets: ['flower:5555']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/ssl/ca.pem
      cert_file: /etc/prometheus/ssl/client-cert.pem
      key_file: /etc/prometheus/ssl/client-key.pem
      insecure_skip_verify: false

  # Redis (comentado hasta que se configure redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:6379']
  #   scrape_interval: 30s

