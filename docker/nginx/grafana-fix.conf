# Configuración de Nginx para resolver problemas de WebSocket en Grafana
# Siguiendo las mejores prácticas de desarrollo

upstream grafana_backend {
    server grafana:3000;
}

server {
    listen 80;
    server_name localhost;

    # Configuración para resolver problemas de WebSocket
    location /api/live/ws {
        # Bloquear conexiones problemáticas al WebSocket live
        access_log off;

        # Bloquear específicamente IPs de Telegram
        if ($remote_addr ~* ^149\.154\.) {
            return 403 "Telegram connections to live WebSocket not allowed";
        }

        if ($remote_addr ~* ^91\.108\.) {
            return 403 "Telegram connections to live WebSocket not allowed";
        }

        # Bloquear todas las demás conexiones al WebSocket live
        return 404 "WebSocket live disabled";
    }

    # Proxy para el resto de Grafana
    location / {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuración para WebSocket (excepto live/ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Configuración específica para API de Grafana
    location /api/ {
        proxy_pass http://grafana_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Headers para CORS si es necesario
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
    }
}
