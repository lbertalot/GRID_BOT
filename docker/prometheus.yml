global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # GridBot API - Métricas principales
  - job_name: 'gridbot-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/api/metrics/metrics/'
    scrape_interval: 15s
    scrape_timeout: 5s

  # GridBot API - Métricas de rentabilidad (Prometheus)
  - job_name: 'gridbot-profitability'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/api/metrics/metrics/prometheus/trading'
    scrape_interval: 30s
    scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093 