[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/
serve_from_sub_path = false

[database]
type = postgres
host = db:5432
name = grafana
user = grafana
password = grafana_pass
ssl_mode = disable
max_idle_conn = 2
max_open_conn = 0
conn_max_lifetime = 14400
log_queries = false

[security]
admin_user = admin
admin_password = admin
disable_initial_admin_creation = false
login_remember_days = 7
cookie_username = grafana_user
cookie_remember_name = grafana_remember
disable_gravatar = false
data_source_proxy_whitelist = 
disable_brute_force_login_protection = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
verify_email_enabled = false
login_hint = email or username
default_theme = dark

[auth.anonymous]
enabled = false
org_name = Main Org.
org_role = Viewer

[auth.basic]
enabled = true

[auth.ldap]
enabled = false
config_file = /etc/grafana/ldap.toml

[log]
mode = console file
level = info
format = text
file = /var/log/grafana/grafana.log
max_size = 100
max_days = 7
max_files = 10

[metrics]
enabled = true
interval_seconds = 10

[snapshots]
external_enabled = true
external_snapshot_url = https://snapshots-origin.raintank.io
external_snapshot_name = Publish to snapshot.raintank.io
snapshot_remove_expired = true

[external_image_storage]
provider = local

[external_image_storage.local]
enabled = false
path = /var/lib/grafana/images

[external_image_storage.webdav]
enabled = false
url = http://localhost:8080/public/
public_url =
username =
password =

[external_image_storage.s3]
enabled = false
bucket = grafana-image-store
region = us-east-1
path = images
access_key =
secret_key =

[external_image_storage.azure_blob]
enabled = false
account_name = grafana
account_key =
container_name = grafana-image-store

[external_image_storage.gcs]
enabled = false
key_file = /path/to/service_account_key.json
bucket = grafana-image-store

[external_image_storage.swift]
enabled = false
bucket_name = grafana-image-store
auth_url = https://your-identity-provider.com/auth/v1.0
username =
password =
tenant_id =
region =

[alerting]
enabled = true
execute_alerts = true
error_or_timeout = 30s
nodata_or_nullvalues = 30s
evaluation_timeout_seconds = 30
notification_timeout_seconds = 30
max_attempts = 3

[unified_alerting]
enabled = false

[explore]
enabled = true

[panels]
disable_sanitize_html = false

[plugins]
allow_loading_unsigned_plugins = 
enable_alpha = false
app_tls_skip_verify_insecure = false

[rendering]
server_url = http://localhost:8081/render
callback_url = http://localhost:3000/
concurrent_render_request_limit = 30
render_timeout = 30s
callback_timeout = 30s
send_user_header = false

[analytics]
reporting_enabled = true
check_for_updates = true
google_analytics_ua_id = 
google_tag_manager_id = 

[security]
cookie_secure = false
cookie_samesite = lax
allow_embedding = false
strict_transport_security = false
strict_transport_security_max_age_seconds = 86400
strict_transport_security_subdomains = false
strict_transport_security_preload = false
x_content_type_options = true
x_xss_protection = true

[emails]
welcome_email_on_sign_up = false
templates_pattern = emails/*.html
smtp.enabled = false
smtp.host = localhost:587
smtp.user =
smtp.password =
smtp.cert_file =
smtp.key_file =
smtp.skip_verify = false
smtp.from_address = admin@grafana.localhost
smtp.from_name = Grafana
smtp.reply_to =
smtp.startTLS_policy = NoStartTLS

[enterprise]
license_path = /etc/grafana/license/license.jwt

[feature_toggles]
enable = 
disable = 